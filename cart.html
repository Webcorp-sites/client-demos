<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CART — ATELIER 015</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>*{font-family:'Inter',sans-serif}.serif{font-family:'Instrument Serif',serif}</style>
</head>
<body class="bg-[#f6f5f0] text-black min-h-screen flex flex-col">
<nav class="flex justify-between items-center px-6 md:px-12 py-6 border-b border-black/10">
  <a href="index.html" class="serif text-2xl">ATELIER 015</a>
  <div class="flex gap-4 text-[12px]"><a href="shop.html" class="underline">← BACK TO SHOP</a><button onclick="clearCart()" class="opacity-60 underline">CLEAR CART</button></div>
</nav>
<div class="flex-1 grid md:grid-cols-[1.2fr_0.8fr]">
  <div class="border-r border-black/10" id="cart-items"></div>
  <div class="px-6 md:px-12 py-8 bg-white">
    <h2 class="serif text-3xl mb-8">Your cart</h2>
    <div class="space-y-3 text-[13px] border-b border-black/10 pb-6">
      <div class="flex justify-between"><span class="opacity-60">Subtotal (<span id="item-count">0</span> items)</span><span id="subtotal">R0</span></div>
      <div class="flex justify-between"><span class="opacity-60">Shipping</span><span id="shipping">FREE</span></div>
    </div>
    <div class="flex justify-between py-6 font-medium text-lg"><span>Total</span><span id="total">R0.00</span></div>
    <button onclick="checkout()" class="w-full bg-black text-white py-4 text-[13px] tracking-[0.2em]">CHECKOUT — <span id="checkout-total">R0</span></button>
  </div>
</div>
<script>
function getCart(){ return JSON.parse(localStorage.getItem('atelier_cart')||'[]'); }
function saveCart(c){ localStorage.setItem('atelier_cart', JSON.stringify(c)); }
function render(){
  const cart = getCart();
  const container = document.getElementById('cart-items');
  if(cart.length===0){
    container.innerHTML = `<div class="px-6 md:px-12 py-20 text-center"><p class="serif text-3xl">Cart empty</p><p class="opacity-60 text-[13px] mt-2">Go to SHOP and add items — they will appear here.</p><a href="shop.html" class="inline-block mt-6 border border-black px-6 py-2 text-[12px]">GO TO SHOP</a></div>`;
  } else {
    container.innerHTML = `<div class="px-6 md:px-12 py-6 border-b border-black/10 text-[11px] opacity-60">${cart.reduce((a,b)=>a+b.qty,0)} ITEMS FROM SHOP</div>` + cart.map(item => `
      <div class="flex gap-6 px-6 md:px-12 py-8 border-b border-black/10">
        <div class="w-24 h-32 bg-[#e9e6df] overflow-hidden"><img src="${item.img}" class="w-full h-full object-cover"></div>
        <div class="flex-1">
          <div class="flex justify-between"><h3 class="font-medium text-[14px]">${item.name}</h3><span>R${item.price} x ${item.qty} = R${item.price*item.qty}</span></div>
          <div class="mt-4 flex gap-3 items-center">
            <div class="flex border border-black/20 text-[12px]">
              <button onclick="changeQty(${item.id},-1)" class="px-3 py-1">-</button>
              <span class="px-3 py-1 border-x border-black/20">${item.qty}</span>
              <button onclick="changeQty(${item.id},1)" class="px-3 py-1">+</button>
            </div>
            <button onclick="removeItem(${item.id})" class="text-[11px] underline opacity-60">REMOVE</button>
          </div>
        </div>
      </div>`).join('');
  }
  const subtotal = cart.reduce((a,b)=>a+b.price*b.qty,0);
  document.getElementById('item-count').innerText = cart.reduce((a,b)=>a+b.qty,0);
  document.getElementById('subtotal').innerText = 'R'+subtotal;
  document.getElementById('total').innerText = 'R'+subtotal+'.00';
  document.getElementById('checkout-total').innerText = 'R'+subtotal;
}
function changeQty(id, d){ let c=getCart(); const i=c.find(x=>x.id===id); i.qty+=d; if(i.qty<=0) c=c.filter(x=>x.id!==id); saveCart(c); render(); }
function removeItem(id){ saveCart(getCart().filter(i=>i.id!==id)); render(); }
function clearCart(){ saveCart([]); render(); }
function checkout(){ const t=getCart().reduce((a,b)=>a+b.price*b.qty,0); if(!t) return alert('Cart empty!'); alert('CHECKOUT R'+t+' — Portfolio demo!'); }
render();
</script>
<footer class="flex justify-between px-6 md:px-12 py-6 text-[11px] tracking-[0.2em] opacity-60 border-t border-black/10">
  <span>© 2026 ATELIER 015 — MIDVAAL</span><span>INSTAGRAM • TIKTOK • EMAIL</span>
</footer>
</body>
</html>
